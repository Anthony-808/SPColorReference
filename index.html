<!DOCTYPE html>
<html>
    <head>
        <title>Color Reference App</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Color Reference App</h1>
        <div id="app">
            <div id="controls">
                <div id="searchContainer">
                    <input id="colorInput" type="text" placeholder="Enter color name">
                    <div id="dropdown"></div>
                </div>
                <div id="display"></div>
                <div id="markerBar"></div>
                <div id="markerDropdown"></div>
            </div>
            <div id="colorInfo">
                RGB: <span id="rgbValue"></span><br>
                HEX: <span id="hexValue"></span><br>
                HSL: <span id="hslValue"></span>
            </div>
        </div>
        <script type="module" src="app.js"></script>
    </body>
</html>
